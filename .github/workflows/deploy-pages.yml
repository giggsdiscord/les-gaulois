# Publication automatique sur GitHub Pages à chaque push sur main (~45 s).
# Variables du dépôt (Settings → Secrets and variables → Actions → Variables) :
#   VITE_SUPABASE_URL       https://<projet>.supabase.co
#   VITE_SUPABASE_ANON_KEY  clé publique du projet : « Publishable key » (sb_publishable_…) ou ancienne clé « anon »
#   VITE_VAPID_PUBLIC_KEY   (facultatif, V4.3) clé publique des notifications push
#                           (elle est faite pour être publique ; la RLS protège les données). Jamais la clé secrète.
# Sans ces variables, le site est publié en mode démo local.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
