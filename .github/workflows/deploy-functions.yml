# Déploiement des 3 Edge Functions sur Supabase depuis GitHub (aucune CLI à installer sur votre PC).
# À configurer une fois dans le dépôt (Settings → Secrets and variables → Actions) :
#   Secret    SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (https://supabase.com/dashboard/account/tokens)
#   Variable  SUPABASE_PROJECT_REF   identifiant du projet (Settings > General > Project ID)
# Notifications push (facultatif, V4.3) — recopiées dans les secrets Supabase à chaque déploiement :
#   Variable  VITE_VAPID_PUBLIC_KEY  clé publique VAPID (aussi utilisée par le site)
#   Secret    VAPID_PRIVATE_KEY      clé privée VAPID
# Se déclenche quand le moteur ou les fonctions changent, ou à la main (onglet Actions → Run workflow).
# Les secrets du jeu (ANTHROPIC_API_KEY, GM_MODEL, CRON_SECRET, ALLOWED_ORIGIN) se posent dans
# Supabase > Edge Functions > Secrets ; ils ne transitent pas par GitHub.
name: Déploiement des Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'src/engine/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La copie du moteur dans supabase/functions/_shared/engine doit être à jour (npm run engine:sync)
      - run: npm run engine:check
      - run: npm test
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Clés des notifications push (secrets Supabase)
        if: ${{ env.VAPID_PRIVATE_KEY != '' && env.VAPID_PUBLIC_KEY != '' }}
        run: supabase secrets set --remote="$PROJECT_REF" --yes VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY"
      - name: Déployer game-engine, gm-ai-action, daily-world-sync
        run: supabase functions deploy --remote="$PROJECT_REF" --yes
